services:
  # ---------- Entree unique : WAF devant le frontal ----------
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: resilience-waf
    restart: unless-stopped
    environment:
      BACKEND: http://frontend:8080
      PORT: "8080"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    ports:
      - "${WAF_BIND:-127.0.0.1}:${WAF_PORT:-8088}:8080"
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./security/waf/ratelimit/zones.conf:/etc/nginx/conf.d/zz-ratelimit.conf:ro
      - ./security/waf/ratelimit/state:/etc/nginx/ratelimit-state:ro
    depends_on: [frontend]
    networks: [front]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resilience-frontend
    restart: unless-stopped
    # Plus de port publie : acces uniquement via le WAF
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [auth-service, backend]
    networks: [front]

  mysql:
    image: mysql:8.0
    container_name: resilience-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Mot de passe root requis}
      MYSQL_DATABASE: resilience_db
      MYSQL_USER: resilience
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Mot de passe utilisateur requis}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resilience-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: resilience
      DB_PASSWORD: ${MYSQL_PASSWORD:?Mot de passe requis}
      DB_NAME: resilience_db
      JWT_SECRET: ${JWT_SECRET:?Secret JWT requis}
      PAYMENT_REQUIRE_FACE: ${PAYMENT_REQUIRE_FACE:-false}
      # Jeton du canari interne appele par le moteur de remediation
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN:?Jeton de remediation requis}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [front, data, obs]

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: resilience-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"   # debug local, a retirer avant la demo
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: resilience
      DB_PASSWORD: ${MYSQL_PASSWORD:?Mot de passe requis}
      DB_NAME: resilience_db
      JWT_SECRET: ${JWT_SECRET:?Secret JWT requis}
      FACE_SERVICE_URL: http://face-service:8000
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?Jeton interne face-service requis}
      FACE_TEMPLATE_KEY: ${FACE_TEMPLATE_KEY:?Cle de chiffrement des gabarits requise}
      # Agent camera natif Windows (camera-agent/), ecoute sur 127.0.0.1 du PC Hote
      CAMERA_AGENT_URL: http://host.docker.internal:${CAMERA_AGENT_PORT:-8765}
      CAMERA_AGENT_TOKEN: ${CAMERA_AGENT_TOKEN:?Jeton agent camera requis}
      # Jeton du module LED ESP8266
      IOT_DEVICE_TOKEN: ${IOT_DEVICE_TOKEN:?Jeton du module IoT requis}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
      face-service:
        condition: service_healthy
    networks: [front, data, obs, face-network]

  # Analyse faciale : interne uniquement (aucun port publie, reseau isole),
  # sans etat, sans acces a la base ni a Internet.
  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: resilience-face
    restart: unless-stopped
    environment:
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?Jeton interne face-service requis}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [face-network]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: resilience-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"   # debug local, a retirer avant la demo
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [backend]
    networks: [obs, face-network]

  grafana:
    image: grafana/grafana:12.1.1
    container_name: resilience-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Utilisateur Grafana requis}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Mot de passe Grafana requis}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [prometheus]
    networks: [obs]

  loki:
    image: grafana/loki:3.5.0
    container_name: resilience-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [obs]

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: resilience-alloy
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy]
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [loki, socket-proxy-ro]
    networks: [obs, docker-api]

  # Acces Docker en LECTURE SEULE pour Alloy (conteneurs, logs, reseaux).
  # Monter docker.sock en :ro ne restreint pas l'API : c'est ce proxy qui filtre.
  socket-proxy-ro:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: resilience-socket-proxy-ro
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-api]

  # Acces Docker RESTREINT pour le moteur de remediation : agir sur les
  # conteneurs, les (re)demarrer et envoyer HUP au WAF. Rien d'autre
  # (lecture via socket-proxy-ro ; pas de creation de conteneur, d'exec, d'images, de volumes ni de suppression).
  socket-proxy-remediation:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: resilience-socket-proxy-remediation
    restart: unless-stopped
    environment:
      CONTAINERS: "0"
      POST: "1"
      ALLOW_RESTARTS: "1"
      ALLOW_START: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [remediation-docker]

  # ---------- Assistant d'exploitation (RAG : Ollama + LangChain) ----------
  # Modele de langage local (<= 8B). Telecharger les modeles apres le up :
  #   docker exec resilience-ollama ollama pull qwen2.5:3b
  #   docker exec resilience-ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:0.6.8
    container_name: resilience-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 6g
    networks: [ai]

  rag:
    build:
      context: ./ai/rag
      dockerfile: Dockerfile
    container_name: resilience-rag
    restart: unless-stopped
    ports:
      - "127.0.0.1:9096:8000"   # interface assistant (local PC Hote)
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${RAG_LLM_MODEL:-qwen2.5:3b}
      EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [ollama]
    networks: [ai]

  # ---------- Detection d'anomalie (AIOps / ML) ----------
  # Isolation Forest sur les metriques Prometheus de l'API de paiement.
  # Expose /status (consomme par la remediation) et /metrics (Grafana).
  ml-detector:
    build:
      context: ./ai/ml
      dockerfile: Dockerfile
    container_name: resilience-ml
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      TARGET_JOB: payment-api
      TARGET_KEY: backend
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    depends_on: [prometheus]
    networks: [obs]

  # ---------- Moteur de remediation (reprise autonome / zero-touch) ----------
  # Surveille les services, decide et agit (restart via proxy restreint,
  # limite de debit WAF), puis verifie la reprise par un canari metier.
  remediation:
    build:
      context: ./remediation
      dockerfile: Dockerfile
    container_name: resilience-remediation
    restart: unless-stopped
    ports:
      - "127.0.0.1:9095:8080"   # tableau de supervision (local PC Hote)
    environment:
      PORT: 8080
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN:?Jeton de remediation requis}
      DOCKER_RO_HOST: socket-proxy-ro
      DOCKER_ACTION_HOST: socket-proxy-remediation
      ML_STATUS_URL: http://ml-detector:8000/status
      WAF_RATELIMIT_DIR: /waf-ratelimit
    volumes:
      # Lecture-ecriture : depose state/active.conf pour l'interrupteur WAF
      - ./security/waf/ratelimit:/waf-ratelimit:rw
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [socket-proxy-ro, socket-proxy-remediation, backend]
    networks: [obs, docker-api, remediation-docker]

volumes:
  mysql_data:
  ollama_models:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  front:            # WAF <-> frontal <-> API / auth
    ipam:
      config:
        - subnet: 172.31.250.0/24
  data:             # acces a MySQL, sans sortie
    internal: true
  obs:              # supervision
  face-network:     # auth <-> analyse faciale, sans sortie
    internal: true
  remediation-docker: # API Docker filtree pour le moteur de remediation, sans sortie
    internal: true
  docker-api:       # API Docker filtree, sans sortie
    internal: true
  ai:               # Ollama + assistant RAG (sortie internet pour les modeles)