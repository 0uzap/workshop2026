services:
  mysql:
    image: mysql:8.0
    container_name: resilience-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Mot de passe root requis}
      MYSQL_DATABASE: resilience_db
      MYSQL_USER: resilience
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Mot de passe utilisateur requis}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - resilience-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: resilience-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: resilience
      DB_PASSWORD: ${MYSQL_PASSWORD:?Mot de passe requis}
      DB_NAME: resilience_db
      JWT_SECRET: ${JWT_SECRET:?Secret JWT requis}
      PAYMENT_REQUIRE_FACE: ${PAYMENT_REQUIRE_FACE:-false}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - resilience-network


  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: resilience-auth
    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3001"

    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: resilience
      DB_PASSWORD: ${MYSQL_PASSWORD:?Mot de passe requis}
      DB_NAME: resilience_db
      JWT_SECRET: ${JWT_SECRET:?Secret JWT requis}
      FACE_SERVICE_URL: http://face-service:8000
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?Jeton interne face-service requis}
      FACE_TEMPLATE_KEY: ${FACE_TEMPLATE_KEY:?Cle de chiffrement des gabarits requise}
      # Agent caméra natif Windows (camera-agent/), écoute sur 127.0.0.1 du PC Hôte
      CAMERA_AGENT_URL: http://host.docker.internal:${CAMERA_AGENT_PORT:-8765}
      CAMERA_AGENT_TOKEN: ${CAMERA_AGENT_TOKEN:?Jeton agent camera requis}
      # Jeton du module LED ESP8266
      IOT_DEVICE_TOKEN: ${IOT_DEVICE_TOKEN:?Jeton du module IoT requis}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      mysql:
        condition: service_healthy
      face-service:
        condition: service_healthy

    networks:
      - resilience-network
      - face-network

  # Analyse faciale : interne uniquement (aucun port publié, réseau isolé),
  # sans état, sans accès à la base ni à Internet.
  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile

    container_name: resilience-face
    restart: unless-stopped

    environment:
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?Jeton interne face-service requis}

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - face-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: resilience-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:8080"

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    depends_on:
      - auth-service
      - backend

    networks:
      - resilience-network



  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: resilience-prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

    depends_on:
      - backend

    networks:
      - resilience-network
      - face-network


  grafana:
    image: grafana/grafana:12.1.1
    container_name: resilience-grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3002:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Utilisateur Grafana requis}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Mot de passe Grafana requis}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - resilience-network

  
  loki:
    image: grafana/loki:3.5.0
    container_name: resilience-loki
    restart: unless-stopped

    command: -config.file=/etc/loki/local-config.yaml

    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    networks:
      - resilience-network

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: resilience-alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy

    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki

    networks:
      - resilience-network


volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  resilience-network:
    driver: bridge
  face-network:
    driver: bridge
    internal: true


