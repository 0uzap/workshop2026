# Interrupteur de limite de debit - zones et cles (toujours chargees, sans effet seules).
# La limite n'est appliquee que si un fichier *.conf est present dans ratelimit-state.
geo $rl_internal {
    default          0;
    127.0.0.0/8      1;   # sondes internes du WAF (healthcheck)
    172.31.250.0/24  1;   # conteneurs du reseau front (remediation, transaction de verification)
    172.31.250.1/32  0;   # passerelle Docker = tout le trafic venant de l'exterieur
}

map "$rl_internal:$uri" $rl_auth_key {
    "~^0:/api/auth/"  "auth";
    default           "";
}

map "$rl_internal:$uri" $rl_global_key {
    "~^0:/api/iot/"   "";        # module LED : jamais limite
    "~^0:"            "global";
    default           "";
}

limit_req_zone $rl_auth_key   zone=rl_auth:1m   rate=5r/s;
limit_req_zone $rl_global_key zone=rl_global:1m rate=30r/s;
limit_req_status 429;
limit_req_log_level warn;

include /etc/nginx/ratelimit-state/*.conf;