server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker résolu à chaque requête : un service redémarré par la
    # remédiation peut changer d'adresse IP sans redémarrer nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://auth-service:3001;
    set $payment_upstream http://backend:3000;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 64k;

    proxy_set_header Host $host;
    # Écrase l'en-tête reçu : le client ne peut pas usurper son adresse IP
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/auth/ {
        proxy_pass $auth_upstream;
    }

    # Module LED ESP8266 : interrogé plusieurs fois par seconde, pas de journal d'accès
    location /api/iot/ {
        access_log off;
        proxy_pass $auth_upstream;
    }

    location /api/payments {
        proxy_pass $payment_upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
