
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'payment-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:9091']

  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:9092']

  - job_name: 'face-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['face-service:9093']

  - job_name: 'remediation'
    metrics_path: /metrics
    static_configs:
      - targets: ['remediation:8080']

  - job_name: 'ml-detector'
    metrics_path: /metrics
    static_configs:
      - targets: ['ml-detector:8000']
