; Module LED bicolore du poste d'authentification (consigne additionnelle 1).
; Projet PlatformIO, à ouvrir dans JetBrains CLion (plugin PlatformIO).

[platformio]
default_envs = nodemcuv2

[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.1

; Carte NodeMCU v2/v3 (ESP-12E)
[env:nodemcuv2]
board = nodemcuv2

; Carte Wemos D1 mini
[env:d1_mini]
board = d1_mini
